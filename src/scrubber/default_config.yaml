# Data Frenzy Local Scrubber - built-in defaults.
#
# Do not edit this file. Put your changes in config/scrubber.yaml next to
# docker-compose.yml; they are merged on top of these defaults. Lists under
# allowlist, deny_list, custom_patterns and context_risk are ADDED to the
# defaults; every other value you set replaces the default.

# Year used for the "ages over 89" rule. null = the current year.
reference_year: null

# Worker processes. "auto" = one per CPU core.
workers: auto

pseudonym:
  token_width: 4               # PERSON_0412
  email_domain: scrubbed.invalid

# Never redacted. Matching is case-insensitive on the whole detected span.
allowlist:
  # Large public companies, payers and vendors. Only kept when detected as an
  # organization; a person who happens to share the name is still scrubbed.
  organizations:
    - Microsoft
    - Google
    - Apple
    - Amazon
    - Salesforce
    - Slack
    - Zoom
    - Epic
    - Epic Systems
    - Cerner
    - Oracle Health
    - athenahealth
    - eClinicalWorks
    - UnitedHealthcare
    - UnitedHealth Group
    - Aetna
    - Cigna
    - Humana
    - Anthem
    - Elevance Health
    - Blue Cross Blue Shield
    - BCBS
    - Kaiser Permanente
    - Centene
    - Molina Healthcare
    - CVS Health
    - CVS
    - Walgreens
    - McKesson
    - Cardinal Health
    - Quest Diagnostics
    - Labcorp
    - Medicare
    - Medicaid
    - CMS
    - HHS
    - CDC
    - FDA
    - NIH
    - Pfizer
    - Moderna
    - Johnson & Johnson
    - Merck
  # Exact terms that are never identifiers (medical codes, product names ...).
  terms:
    - COVID-19
    - SARS-CoV-2
    - ICD-10
    - ICD-10-CM
    - ICD-10-PCS
    - ICD-9
    - CPT
    - HIPAA
    - HbA1c
    - A1C
    - H1N1
    - B12
    - N95
  # URL domains that may be kept (public reference sites). Empty = all URLs scrubbed.
  url_domains: []

# Always redacted, wherever they appear (case-insensitive whole-word match).
# Keys are entity types: PERSON, ORGANIZATION, LOCATION, STREET_ADDRESS, OTHER_ID ...
deny_list:
  PERSON: []
  ORGANIZATION: []
  LOCATION: []
  OTHER_ID: []

# Your own ID formats. Example:
#   - name: clinic_patient_id
#     entity: MEDICAL_RECORD_NUMBER
#     regex: '\bPT-\d{6}\b'
#     score: 0.9
custom_patterns: []

# Minimum detector confidence (0-1) per entity type.
thresholds:
  default: 0.5
  PERSON: 0.5
  ORGANIZATION: 0.6
  LOCATION: 0.6
  PHONE_NUMBER: 0.4
  URL: 0.5
  OTHER_ID: 0.45

verification:
  # A scrubbed file fails if re-running detection on it finds anything at or
  # above this confidence that is not a token/generalized value.
  residual_threshold: 0.6

# Labeled identifiers: a label such as "MRN:" followed by a value.
# value: "id" = letters/digits with at least one digit; "plate" = like id but may
# contain one space ("ABC 123"); "digits" = SSN-shaped; "handle" = usernames.
labeled_ids:
  - entity: US_SSN
    labels: ['ssn', 'ss#', 'social security', 'soc\.? ?sec\.?']
    value: digits
  - entity: MEDICAL_RECORD_NUMBER
    labels: ['mrn', 'mr#', 'med(?:ical)?\.? ?rec(?:ord)?s?', 'chart', 'patient', 'pt\.?', 'hospital', 'emr', 'ehr']
    value: id
  - entity: HEALTH_PLAN_ID
    labels: ['member', 'subscriber', 'policy', 'medicaid', 'medicare', 'mbi', 'hicn', 'beneficiary', 'insurance', 'health ?plan', 'group', 'plan', 'payer', 'coverage', 'cin']
    value: id
  - entity: ACCOUNT_NUMBER
    labels: ['acct', 'account', 'a/c', 'bank', 'routing', 'aba', 'billing', 'invoice', 'customer', 'card', 'credit card', 'iban', 'swift', 'guarantor']
    value: id
  - entity: LICENSE_NUMBER
    labels: ['licen[cs]e(?! ?plate)', 'lic\.?', 'npi', 'dea', 'certificate', 'cert\.?', 'certification', 'registration', 'permit', "driver'?s? licen[cs]e", 'dl', 'passport', 'board', 'upin', 'tin', 'ein', 'tax']
    value: id
  - entity: VEHICLE_ID
    labels: ['vin', 'vehicle(?: identification)?']
    value: id
  - entity: VEHICLE_ID
    labels: ['licen[cs]e ?plate', 'plate', 'tag', 'registration plate']
    value: plate
  - entity: DEVICE_ID
    labels: ['serial', 's/n', 'sn', 'device', 'imei', 'meid', 'udi', 'mac', 'asset ?tag', 'implant', 'pacemaker', 'pump', 'model/serial']
    value: id
  - entity: BIOMETRIC_ID
    labels: ['fingerprint', 'finger ?print', 'voiceprint', 'voice ?print', 'biometric', 'retina(?:l)?(?: scan)?', 'iris(?: scan)?', 'face ?(?:id|template)', 'palm ?print', 'gait']
    value: id
  - entity: OTHER_ID
    labels: ['claim', 'case', 'ticket', 'reference', 'ref\.?', 'confirmation', 'conf\.?', 'order', 'tracking', 'employee', 'emp\.?', 'badge', 'student', 'record', 'record locator', 'booking', 'reservation', 'encounter', 'visit', 'accession', 'specimen', 'lab', 'requisition', 'authorization', 'auth\.?', 'prior auth', 'referral', 'episode', 'admission', 'account holder', 'enrollment', 'application', 'contract', 'id']
    value: id
  - entity: OTHER_ID
    labels: ['user ?name', 'user ?id', 'login', 'log-in', 'portal (?:user|login|id|username)', 'handle', 'screen ?name', 'twitter', 'instagram', 'tiktok', 'facebook', 'linkedin', 'skype', 'slack (?:handle|user)', 'discord']
    value: handle

# Context-risk keyword lists (used in Phase 4 to flag text for human review).
context_risk:
  unique_roles: []
  rare_conditions: []
  small_towns: []
  relationship_terms: []

email:
  # Headers kept (after scrubbing). Everything else is removed, including
  # Received, Return-Path, X-* and DKIM headers that carry hostnames and IPs.
  keep_headers:
    - From
    - To
    - Cc
    - Bcc
    - Reply-To
    - Sender
    - Subject
    - Date
    - Message-ID
    - In-Reply-To
    - References
    - MIME-Version
    - Content-Type
    - Content-Transfer-Encoding
    - Content-Disposition
    - Content-ID
    - Content-Language
    - Thread-Topic
    - Importance
    - Priority
    - X-Priority

mbox:
  # Mailboxes larger than this are split into shards processed in parallel.
  shard_mb: 256
  checkpoint_every: 200

json:
  # Plain .json files are loaded whole; larger ones should be JSON Lines.
  max_mb: 1024

tabular:
  sample_rows: 200
  # Unknown column -> classified by content when this share of sampled
  # values is one identifier type.
  content_match_ratio: 0.6
  # Column actions: pseudonymize | generalize | drop (blank the values) |
  # remove (delete the column) | keep | scrub (free-text detection per cell)
  column_rules:
    person_name: pseudonymize
    email: pseudonymize
    phone: pseudonymize
    fax: pseudonymize
    ssn: pseudonymize
    mrn: pseudonymize
    health_plan: pseudonymize
    account: pseudonymize
    license: pseudonymize
    vehicle: pseudonymize
    device: pseudonymize
    url: pseudonymize
    ip: pseudonymize
    biometric: drop
    other_id: pseudonymize
    organization: pseudonymize
    address: pseudonymize
    city: pseudonymize
    zip: generalize
    dob: generalize
    date: generalize
    age: generalize
    state: keep
    country: keep
    notes: scrub
    unknown: scrub
  # Per-file overrides: {"patients.csv": {"Favorite Color": keep}}
  column_overrides: {}
