# Builds the Mac app (.dmg) for Apple Silicon and Intel Macs.
# Run by hand (Actions tab -> mac-app -> Run workflow) or by pushing a v* tag:
# Mac build minutes count 10x against a private repo's free allowance.
# The .dmg files are published to Cloudflare R2 only (no GitHub artifact copies: storage quota).
name: mac-app

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon (arm64), Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_THREAD_LIMIT: "1"
      APP_VERSION: "0.1.0"
      R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract OCR
        run: brew install tesseract
      - name: Install Python packages and the language model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview==6.2.1 pyinstaller==6.22.3
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
      - name: Quick tests
        run: python -m pip install -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider tests/test_desktop.py tests/test_identifiers.py tests/test_images.py
      # Developer ID certificate (secrets MAC_CERT_P12_BASE64 + MAC_CERT_PASSWORD) goes into a
      # throwaway keychain for this run only. Without the secrets the app is signed ad hoc.
      - name: Load the Developer ID certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no certificate: ad-hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$ID" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Build, bundle OCR, sign, self-test, make .dmg, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/build.sh python
      - name: Upload the .dmg to Cloudflare R2
        if: ${{ env.R2_KEY != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          f=$(ls dist/*.dmg | head -1); name=$(basename "$f"); arch=$(uname -m)
          aws s3 cp "$f" "s3://datafrenzy-downloads/scrubber/$APP_VERSION/$name" --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$f" "s3://datafrenzy-downloads/scrubber/latest/DataFrenzyScrubber-mac-$arch.dmg" --endpoint-url "${{ secrets.R2_ENDPOINT }}"
